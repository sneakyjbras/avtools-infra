apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: avtools
  namespace: argocd
spec:
  goTemplate: true
  generators:
    # One entry per environment. master mirrors QA → QA tracks `master`;
    # PROD is promoted by fast-forwarding the `prod` branch to a release tag.
    - list:
        elements:
          - env: qa
            namespace: avtools-qa
            targetRevision: master
          # PROD DISABLED AGAIN (emergency back-out). !11 re-enabled this while the
          # Puppet monolith was STILL running (its monolith-off puppet MR !499 was
          # blocked on CI), so k8s-prod and the monolith both polled/wrote the shared
          # prod DB — a double-write. Re-disabled to return to monolith-only. Do the
          # real cutover DELIBERATELY: bring `prod` up to master, re-create the
          # avtools-prod Secrets on the current cluster, then re-enable this element
          # AND stop the monolith timers (MR !499) in the SAME window.
          # - env: prod
          #   namespace: avtools-prod
          #   targetRevision: prod
  template:
    metadata:
      name: 'avtools-{{.env}}'
    spec:
      project: avtools
      source:
        repoURL: https://gitlab.cern.ch/itdcim/av-tools-infra.git
        targetRevision: '{{.targetRevision}}'
        path: chart
        helm:
          valueFiles:
            - values.yaml
            - 'values-{{.env}}.yaml'
      destination:
        server: https://kubernetes.default.svc
        namespace: '{{.namespace}}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          # The tbag-bridged Secret is created out-of-band; the chart never renders
          # it, so ArgoCD never manages or prunes it.
          - CreateNamespace=true
        retry:
          limit: 5
          backoff:
            duration: 15s
            maxDuration: 3m
            factor: 2

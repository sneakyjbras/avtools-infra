apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: avtools
  namespace: argocd
spec:
  goTemplate: true
  generators:
    # One entry per environment. master mirrors QA → QA tracks `master`;
    # PROD is promoted by fast-forwarding the `prod` branch to a release tag.
    - list:
        elements:
          # QA soaks chart changes on the `qa` branch; promote to prod by merging
          # `qa` -> `master` (which the prod element below tracks).
          - env: qa
            namespace: avtools-qa
            targetRevision: qa
          # PROD runs on k8s from `master`. The only difference from QA is the
          # values-prod.yaml overlay (namespace, image tag, secrets). There is
          # no separate `prod` branch. Enable this element ONLY after:
          #   1. avtools-prod Secret present on the cluster (tbag bridge), and
          #   2. the Puppet monolith prod timers are stopped and verified dead
          #      (shared prod DB: never two writers at once).
          - env: prod
            namespace: avtools-prod
            targetRevision: master
  template:
    metadata:
      name: 'avtools-{{.env}}'
    spec:
      project: avtools
      source:
        repoURL: https://gitlab.cern.ch/itdcim/av-tools-infra.git
        targetRevision: '{{.targetRevision}}'
        path: chart
        helm:
          valueFiles:
            - values.yaml
            - 'values-{{.env}}.yaml'
      destination:
        server: https://kubernetes.default.svc
        namespace: '{{.namespace}}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          # The tbag-bridged Secret is created out-of-band; the chart never renders
          # it, so ArgoCD never manages or prunes it.
          - CreateNamespace=true
        retry:
          limit: 5
          backoff:
            duration: 15s
            maxDuration: 3m
            factor: 2

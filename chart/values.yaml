# Default (base) values. Environment overlays: values-qa.yaml / values-prod.yaml.

nameOverride: ""
fullnameOverride: ""

# avtools_environment / submitter_environment label. Overridden per env.
environment: qa
availabilityZone: cern-geneva-b
hostgroup: itdcim/avtools

image:
  repository: registry.cern.ch/avtools/avtools
  # Moving env tag (qa|prod) so ArgoCD need not commit per-SHA image bumps.
  tag: qa
  pullPolicy: Always

# Pull secret for the private Harbor project (created out-of-band; see README).
imagePullSecrets:
  - name: harbor-avtools

serviceAccount:
  create: true
  name: ""

# Native K8s Secret populated by the tbag bridge (scripts/sync-secret.sh).
# The chart NEVER templates secret values — it only references this name.
secretName: avtools-secrets # pragma: allowlist secret

# Non-secret config → ConfigMap (envFrom on every job). The *_username / client_id
# halves are non-secret (they live in Puppet hiera, not teigi); the passwords are
# the teigi keys pulled into the Secret.
config:
  MONIT_TENANT: avtools
  MONIT_OTLP_ENDPOINT: monit-otlp.cern.ch:4316
  MONIT_OTLP_INSECURE: "true"
  OTEL_SERVICE_NAME: avtools

eam:
  username: avqa
landb:
  clientId: av-tools-qa
  audience: production-microservice-landb-rest

# Sentry: disabled until IT-PW issues a DSN; the DSN is stored in the Secret
# (key SENTRY_DSN) and only injected when enabled.
sentry:
  enabled: false
  tracesSampleRate: "0.0"

# Per-pod sizing. Unchanged from the 3x m2.medium era on purpose: the memory
# starvation that jittered the sweep was the 3.75 GB nodes running 94-96%
# mem-allocated, NOT the request itself — the 2026-07 move to 7.5 GB m2.large
# workers is the fix. On m2.large (~6.5 GB allocatable) with ~2 pods/node, a
# 256Mi request reserves <768Mi/node and leaves >5.5 GB headroom. CPU stays low
# (250m request) because the work is I/O-bound SNMP/HTTP that mostly waits on the
# network; the 1-core limit lets a pod burst without hogging a 4-core node.
resources:
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 512Mi

# ---------------------------------------------------------------------------
# Node partitioning. The worker pool is 4 nodes x 4 cores = 16 cores (2026-07
# rescale: 4x m2.large, up from 3x m2.medium). Spread the same-component pods
# evenly across nodes so a shardable tier's shards land spread across workers
# instead of piling onto one box and starving another (e.g. snmp-critical:
# 8 shards -> ~2 pods/node). maxSkew 1 keeps the per-node count within 1 of
# even. Soft (ScheduleAnyway) so a cordoned/down node never blocks the tick —
# it just co-locates until the node returns. No-op for the single-pod
# reconciliation jobs (run-eam / run-landb / sync-rooms).
#
# Note: with 4 independently-scheduled snmp-* tiers below, this setting only
# spreads ONE tier's own shards across nodes once that tier is firing — it
# does NOT stop two different jobs (e.g. snmp-high and run-eam) from firing
# in the same tick and stacking pods cluster-wide. That cross-job problem is
# handled by the minute-offset schedule stagger (see comment on `jobs:`
# below), not by topologySpread.
# ---------------------------------------------------------------------------
topologySpread:
  enabled: true
  maxSkew: 1
  whenUnsatisfiable: ScheduleAnyway

# ---------------------------------------------------------------------------
# Batch services. shards == completions == parallelism == SHARD_TOTAL.
# Sharding is crc32(equipment_no) % SHARD_TOTAL == JOB_COMPLETION_INDEX.
#
# snmp-critical / snmp-high / snmp-medium / snmp-low (2026-07) replace the
# single snmp-timeseries job with a PUBLISH-FILTER tier split: `avtools
# snmp-timeseries --priority {critical,high,medium,low}` still does a FULL
# fleet sweep every run (collects everything, same as before) and only
# PUBLISHES that tier's series to MONIT. Phase 1 of the fix — it trades spare,
# I/O-bound/low-CPU SNMP+ping capacity (cheap, we have headroom) to cut the
# scarce MONIT OTLP ingest rate (the actual bottleneck) by publishing
# less-urgent metrics less often. Because every tier still does per-device
# work (SNMP poll one device, write that device's rows) over the WHOLE fleet,
# all four are shardable the same way snmp-timeseries was: disjoint devices
# => disjoint reads and disjoint DB writes.
#
# avtools auto-adds a `tier` label (from --priority) to the cycle-guardrail
# metrics — no chart-side label plumbing needed — so the Grafana SLO alerts
# can `group by (tier)` across these four jobs.
#
# Schedule stagger — naively */5, */15, hourly and every-6h all fire at
# minute :00 (top of hour), colliding with EACH OTHER and with the existing
# run-eam/run-landb (*/5) and sync-rooms (*/15). concurrencyPolicy: Forbid
# only stops a job overlapping ITSELF, not cross-job — and a concurrent OTLP
# flush burst across jobs is the confirmed cause of past MONIT ingest gaps
# (and it spikes node pod count). So each tier below gets its own minute
# offset:
#   snmp-critical  */5            -> :00,:05,:10,...,:55
#   snmp-high      3-59/15        -> :03,:18,:33,:48
#   snmp-medium    7 * * * *      -> :07 hourly
#   snmp-low       11 */6 * * *   -> :11 every 6h (00:11/06:11/12:11/18:11)
# 3/7/11 are never multiples of 5, so high/medium/low never land on a
# snmp-critical/run-eam/run-landb (*/5) tick, and 3/7/11 also miss the
# sync-rooms */15 grid (:00/:15/:30/:45) — high/medium/low never collide with
# ANY other job in this chart. snmp-critical keeps the *unstaggered* */5
# offset the old snmp-timeseries already used, so it still coincides with
# run-eam/run-landb (also */5) and, quarter-hourly, sync-rooms — that overlap
# is pre-existing, not a regression, and freshness matters most for the
# critical tier so it isn't worth moving off the clean */5 boundary. Net
# effect: at most one snmp-* tier is ever running alongside run-eam+run-landb
# (+ sync-rooms on the quarter-hour), never two snmp-* tiers at once.
#
# run-eam, run-landb and sync-rooms are bulk RECONCILIATION syncs: each
# fetches an ENTIRE inventory/cache, diffs it against Postgres, and upserts.
# The app code does NOT shard them — and it shouldn't: reconciliation needs
# the GLOBAL view to detect stale/orphaned rows, which a shard that sees only
# its slice cannot do safely. So they MUST be shards: 1. Setting shards > 1
# here just runs N identical full syncs that fight over the same rows
# (contention, wasted DB load, lost updates) — it does not speed anything up.
# (If EAM reconciliation ever outgrows one pod, the fix is real shard-aware
# reconciliation in the app, not more copies of the whole sync.)
# ---------------------------------------------------------------------------
jobs:
  snmp-critical:
    enabled: true
    schedule: "*/5 * * * *"
    # Unstaggered */5 — same cadence/offset as the old snmp-timeseries (matches
    # the Puppet VM's clean rate; see stagger comment above for why it's the one
    # tier left on the plain */5 grid). SNMP is I/O-bound. We briefly ran */2 for
    # finer resolution, but 8 shards x */2 pushed ~180k samples/hr to MONIT (2.5x
    # the VM) and MONIT dropped the excess in regular ~1h blocks — a tenant
    # ingestion limit, NOT a cluster problem (collection was perfect, gRPC export
    # confirmed OK). */5 = ~72k samples/hr, matching the monolith VM which has zero
    # gaps. The 15-min Grafana gather still gets ~3 samples/window so plots stay
    # smooth.
    # Mirrors today's snmp-timeseries exactly (NOT a placeholder): most frequent
    # tier, needs the fastest sweep for freshness. 8 shards x 16 threads; sweep
    # ~46s; concurrencyPolicy: Forbid.
    shards: 8 # per-device work → shardable; ~2 pods per worker node
    threads: 16 # I/O-bound; 8 shards x 16 = 128 concurrent
    # Stagger the shard EXPORTS. All 8 shards start on the same tick and finish
    # ~together, so their OTLP/gRPC flushes hit MONIT as one concurrent burst — the
    # confirmed cause of the ~1h ingestion gaps (egress probe: 30/30 TCP ok, so it's
    # MONIT rejecting the burst, not the network). Per-shard startup sleep of
    # index*3s spreads the finish/export over ~21s instead of one spike. (Pairs with
    # the force_flush retry in av-tools >=1.9.1.) Same formula on every tier below.
    command:
      ["sh", "-c", "sleep $(( ${JOB_COMPLETION_INDEX:-0} * 3 )); exec avtools --logs snmp-timeseries --priority critical"]
    activeDeadlineSeconds: 150 # unchanged: room for the index*3s stagger + ~46s sweep + flush retries
    backoffLimit: 1
    netRaw: true # ICMP ping needs CAP_NET_RAW
    secretKeys: ["DATABASE_URL", "MONIT_PASSWORD"]
  snmp-high:
    enabled: true
    schedule: "3-59/15 * * * *" # :03,:18,:33,:48 — offset stagger, see `jobs:` comment above
    # PLACEHOLDER shards/threads: not latency-critical (15-min tier), so smaller
    # than critical by design. TBD from the pending G0 cardinality measurement +
    # observed per-tier sweep time — do not treat these as tuned values.
    shards: 4
    threads: 16
    command:
      ["sh", "-c", "sleep $(( ${JOB_COMPLETION_INDEX:-0} * 3 )); exec avtools --logs snmp-timeseries --priority high"]
    # PLACEHOLDER: 4 shards (half of critical's 8) sweeping the same full fleet
    # implies roughly ~2x critical's per-shard sweep time; scaled up from
    # critical's 150s accordingly. Revisit once real G0 timing data lands.
    activeDeadlineSeconds: 220
    backoffLimit: 1
    netRaw: true # ICMP ping needs CAP_NET_RAW
    secretKeys: ["DATABASE_URL", "MONIT_PASSWORD"]
  snmp-medium:
    enabled: true
    schedule: "7 * * * *" # :07 hourly — offset stagger, see `jobs:` comment above
    # PLACEHOLDER shards/threads: hourly tier, so lower concurrency than high is
    # acceptable. TBD from the pending G0 cardinality measurement + observed
    # per-tier sweep time — do not treat these as tuned values.
    shards: 4
    threads: 8
    command:
      ["sh", "-c", "sleep $(( ${JOB_COMPLETION_INDEX:-0} * 3 )); exec avtools --logs snmp-timeseries --priority medium"]
    # PLACEHOLDER: same shard count as high but half the threads (8 vs 16), so
    # roughly ~2x high's sweep time; scaled up accordingly. Hourly cadence gives
    # ample headroom either way. Revisit once real G0 timing data lands.
    activeDeadlineSeconds: 320
    backoffLimit: 1
    netRaw: true # ICMP ping needs CAP_NET_RAW
    secretKeys: ["DATABASE_URL", "MONIT_PASSWORD"]
  snmp-low:
    enabled: true
    schedule: "11 */6 * * *" # :11 every 6h (00:11/06:11/12:11/18:11) — offset stagger, see `jobs:` comment above
    # Lowest-urgency tier (6h cadence), so the smallest footprint of the four:
    # 2x8 = 16 concurrent threads, vs critical 128 / high 64 / medium 32.
    #
    # threads was 4 and is now 8. At 4 threads this tier put 1375/2/4 = 172
    # devices on every thread — 16x the per-thread load of critical, which is
    # MEASURED at ~40s for 10.7 devices/thread (8x16, prod 2026-07-30). Scaling
    # that linearly (the sweep is I/O-bound, so per-thread device count is the
    # driver) puts a 4-thread sweep at ~640s — PAST its own 600s
    # activeDeadlineSeconds, i.e. killed mid-sweep every time. At 8 threads the
    # per-thread load halves to 86 devices (~320s projected), which fits the
    # raised 1200s deadline with the same ~2-4x headroom the other three tiers
    # have. 8 is also well under the 16 threads/shard already proven safe by
    # critical, so this adds no over-concurrency risk.
    shards: 2
    threads: 8
    command:
      ["sh", "-c", "sleep $(( ${JOB_COMPLETION_INDEX:-0} * 3 )); exec avtools --logs snmp-timeseries --priority low"]
    # Fewest shards AND fewest threads of the four tiers, so still by far the
    # longest per-pod sweep (~320s projected at 2x8). 1200s is ~4x that, which
    # is generous on purpose: the 6h cadence means a slow sweep costs nothing,
    # whereas a deadline kill loses the whole tier's publish for 6 hours.
    # activeDeadlineSeconds is a runaway kill-switch, not a latency target.
    activeDeadlineSeconds: 1200
    backoffLimit: 1
    netRaw: true # ICMP ping needs CAP_NET_RAW
    secretKeys: ["DATABASE_URL", "MONIT_PASSWORD"]
  run-eam:
    enabled: true
    schedule: "*/5 * * * *"
    shards: 1 # reconciliation sync — MUST stay 1 (was 4: 4x redundant, write contention)
    threads: 16 # single pod, I/O-bound; raised for reconciliation throughput
    command: ["avtools", "--logs", "run-eam"]
    stableInstanceId: true # single pod -> pin a stable OTLP instance id (Mimir cardinality)
    activeDeadlineSeconds: 240
    backoffLimit: 1
    netRaw: false
    secretKeys: ["DATABASE_URL", "MONIT_PASSWORD", "MY_PASSWORD"]
  run-landb:
    enabled: true
    schedule: "*/5 * * * *"
    shards: 1
    threads: 8 # single pod, I/O-bound; raised for throughput
    command: ["avtools", "--logs", "run-landb"]
    stableInstanceId: true # single pod -> pin a stable OTLP instance id (Mimir cardinality)
    activeDeadlineSeconds: 180
    backoffLimit: 1
    netRaw: false
    secretKeys: ["DATABASE_URL", "MONIT_PASSWORD", "LANDB_CLIENT_SECRET"]
  # sync-rooms recomputes the device->room mapping from Postgres alone: it reads
  # eam_devices/eam_positions (populated by run-eam) and diff-writes the derived
  # table, so it depends on run-eam having populated that cache first. Same
  # cadence or a slight offset from run-eam is fine either way — concurrencyPolicy:
  # Forbid (template) only prevents THIS job from overlapping itself, so a
  # same-tick schedule just means sync-rooms reads whatever run-eam last
  # committed, not a torn read.
  sync-rooms:
    enabled: true
    schedule: "*/15 * * * *" # 15min-hourly requested; */15 is most responsive. Tunable up to "0 * * * *".
    shards: 1 # reconciliation over the whole cache; MUST stay 1 (global view), like run-eam/run-landb
    threads: 1 # not threaded; the resolver is in-memory
    command: ["avtools", "--logs", "sync-rooms"]
    stableInstanceId: true # single pod -> pin a stable OTLP instance id (Mimir cardinality), like run-eam
    activeDeadlineSeconds: 120 # loads eam_devices + eam_positions, climbs in memory, diff-writes — fast
    backoffLimit: 1
    netRaw: false # no ICMP/raw sockets
    secretKeys: ["DATABASE_URL", "MONIT_PASSWORD"] # DB + heartbeat only; NO EAM/LanDB creds (reads Postgres cache)

# ---------------------------------------------------------------------------
# Recovery watchdog (AP layer 4): alert when a CronJob hasn't succeeded within
# freshnessMinutes. Requires the Prometheus Operator CRD (kube-prometheus-stack).
# ---------------------------------------------------------------------------
prometheusRule:
  enabled: false
  freshnessMinutes: 10

# ---------------------------------------------------------------------------
# Fluent Bit Kubernetes Events shipper → CERN MonIT OpenSearch, index
# monit-logs-ss4o_avtools (the older "otel-logs_avtools" name once documented
# here was wrong). Ships this namespace's Event objects — pod deadline
# kills, OOM kills, ImagePullBackOff, evictions, failed Jobs, ArgoCD syncs —
# the "Infra" layer of the 3-layer alerting design. Application logs are a
# SEPARATE pipeline: the avtools process exports its own structured logs
# directly via OTLP, not through this shipper (see chart/templates/
# fluent-bit.yaml header comment for why: stdout here is ANSI-coloured
# console text, not JSON, and CERN's own cern-magnum-fluentd DaemonSet
# already tails every node's /var/log/containers/*.log to central MonIT).
#
# One replica (Deployment, not DaemonSet): kubernetes_events reads the API
# server, not per-node log files, so a single pod sees every event in the
# namespace; a DaemonSet would ship each event once per node.
#
# Default OFF: flip fluentBit.enabled to true per environment in
# values-qa.yaml / values-prod.yaml once ready — the transport itself
# (endpoint/port/TLS/CA/credential below) is verified working.
# ---------------------------------------------------------------------------
fluentBit:
  enabled: false
  image: cr.fluentbit.io/fluent/fluent-bit:3.1.9
  # OTLP/HTTP logs receiver. :4319 is the only TLS-capable OTLP port
  # (TLSv1.3 verified live); :4318 is the same endpoint in plaintext; the
  # gRPC ports (4316/4317) support no TLS at all and return UNAVAILABLE for
  # logs, so HTTP/4319 is the only viable transport here (unrelated to the
  # metrics path's MONIT_OTLP_ENDPOINT above, which is gRPC/4316).
  logsEndpointHost: monit-otlp.cern.ch
  logsEndpointPort: "4319"
  logsUri: /v1/logs
  tenant: avtools
  # Credential is the SAME MONIT_PASSWORD the metrics/CronJob path already
  # uses (MonIT confirmed: same OTLP endpoint, same password) — read from the
  # existing avtools-secrets Secret. There is no separate logs credential.
  #
  # CA chain needed to verify monit-otlp.cern.ch: CERN Grid Certification
  # Authority (intermediate) + CERN Root Certification Authority 2. Verified
  # live: the root alone, and the Debian default trust store, both fail —
  # the server doesn't send its own intermediate. Both certs are public CAs
  # (safe to commit); bundled at chart/files/cern-chain.pem.
  caBundle:
    # Leave empty (default) to have the chart create+own a ConfigMap from the
    # bundled file above. Set to an externally managed ConfigMap name instead
    # to skip that and just mount the existing one (the chart then creates
    # nothing).
    configMapName: ""
    key: ca.pem
    mountPath: /etc/fluent-bit/certs
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

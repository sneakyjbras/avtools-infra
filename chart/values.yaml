# Default (base) values. Environment overlays: values-qa.yaml / values-prod.yaml.

nameOverride: ""
fullnameOverride: ""

# avtools_environment / submitter_environment label. Overridden per env.
environment: qa
availabilityZone: cern-geneva-b
hostgroup: itdcim/avtools

image:
  repository: registry.cern.ch/avtools/avtools
  # Moving env tag (qa|prod) so ArgoCD need not commit per-SHA image bumps.
  tag: qa
  pullPolicy: Always

# Pull secret for the private Harbor project (created out-of-band; see README).
imagePullSecrets:
  - name: harbor-avtools

serviceAccount:
  create: true
  name: ""

# Native K8s Secret populated by the tbag bridge (scripts/sync-secret.sh).
# The chart NEVER templates secret values — it only references this name.
secretName: avtools-secrets # pragma: allowlist secret

# Non-secret config → ConfigMap (envFrom on every job). The *_username / client_id
# halves are non-secret (they live in Puppet hiera, not teigi); the passwords are
# the teigi keys pulled into the Secret.
config:
  MONIT_TENANT: avtools
  MONIT_OTLP_ENDPOINT: monit-otlp.cern.ch:4316
  MONIT_OTLP_INSECURE: "true"
  OTEL_SERVICE_NAME: avtools

eam:
  username: avqa
landb:
  clientId: av-tools-qa
  audience: production-microservice-landb-rest

# Sentry: disabled until IT-PW issues a DSN; the DSN is stored in the Secret
# (key SENTRY_DSN) and only injected when enabled.
sentry:
  enabled: false
  tracesSampleRate: "0.0"

# Per-pod sizing. Unchanged from the 3x m2.medium era on purpose: the memory
# starvation that jittered the sweep was the 3.75 GB nodes running 94-96%
# mem-allocated, NOT the request itself — the 2026-07 move to 7.5 GB m2.large
# workers is the fix. On m2.large (~6.5 GB allocatable) with ~2 pods/node, a
# 256Mi request reserves <768Mi/node and leaves >5.5 GB headroom. CPU stays low
# (250m request) because the work is I/O-bound SNMP/HTTP that mostly waits on the
# network; the 1-core limit lets a pod burst without hogging a 4-core node.
resources:
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 512Mi

# ---------------------------------------------------------------------------
# Node partitioning. The worker pool is 4 nodes x 4 cores = 16 cores (2026-07
# rescale: 4x m2.large, up from 3x m2.medium). Spread the same-component pods
# evenly across nodes so the shardable job (snmp-timeseries: 8 shards) lands
# ~2 pods per worker node instead of piling several shards onto one box and
# starving another. maxSkew 1 keeps the per-node count within 1 of even (8
# shards / 4 nodes = 2/node). Soft (ScheduleAnyway) so a cordoned/down node never
# blocks the tick — it just co-locates until the node returns. No-op for the
# single-pod reconciliation jobs (run-eam / run-landb).
# ---------------------------------------------------------------------------
topologySpread:
  enabled: true
  maxSkew: 1
  whenUnsatisfiable: ScheduleAnyway

# ---------------------------------------------------------------------------
# The three batch services. shards == completions == parallelism == SHARD_TOTAL.
# Sharding is crc32(equipment_no) % SHARD_TOTAL == JOB_COMPLETION_INDEX.
#
# ONLY snmp-timeseries is shardable. It does per-device work (SNMP poll one
# device, write that device's rows), so partitioning the device list across N
# pods is safe: disjoint devices => disjoint reads and disjoint DB writes.
#
# run-eam and run-landb are bulk RECONCILIATION syncs: each fetches the ENTIRE
# EAM/LanDB inventory, diffs it against Postgres, and upserts. The app code does
# NOT shard them (run_eam/run_landb take no shard params) — and it shouldn't:
# reconciliation needs the GLOBAL view to detect stale/orphaned rows, which a
# shard that sees only its slice cannot do safely. So they MUST be shards: 1.
# Setting shards > 1 here just runs N identical full syncs that fight over the
# same rows (contention, wasted DB load, lost updates) — it does not speed
# anything up. (If EAM reconciliation ever outgrows one pod, the fix is real
# shard-aware reconciliation in the app, not more copies of the whole sync.)
# ---------------------------------------------------------------------------
jobs:
  snmp-timeseries:
    enabled: true
    schedule: "*/5 * * * *"
    # SNMP is I/O-bound (threads mostly wait on the network), so we scale
    # concurrency up for throughput without saturating the 16 cores. 8 shards x
    # 10 threads = 80 concurrent SNMP threads (spread ~2/node across the 4
    # m2.large workers via topologySpread), up from 8 x 8 = 64 on the old 6-core
    # pool. Dial back if cycle_duration approaches the 240s deadline.
    shards: 8 # per-device work → shardable; ~2 pods per worker node
    threads: 10 # I/O-bound; 8 shards x 10 = 80 concurrent, sweep well under 5 min
    command: ["avtools", "--logs", "snmp-timeseries"]
    activeDeadlineSeconds: 240 # 80 concurrent I/O threads → fast sweep; fits the 5-min window
    backoffLimit: 1
    netRaw: true # ICMP ping needs CAP_NET_RAW
    secretKeys: ["DATABASE_URL", "MONIT_PASSWORD"]
  run-eam:
    enabled: true
    schedule: "*/5 * * * *"
    shards: 1 # reconciliation sync — MUST stay 1 (was 4: 4x redundant, write contention)
    threads: 16 # single pod, I/O-bound; raised for reconciliation throughput
    command: ["avtools", "--logs", "run-eam"]
    activeDeadlineSeconds: 240
    backoffLimit: 1
    netRaw: false
    secretKeys: ["DATABASE_URL", "MONIT_PASSWORD", "MY_PASSWORD"]
  run-landb:
    enabled: true
    schedule: "*/5 * * * *"
    shards: 1
    threads: 8 # single pod, I/O-bound; raised for throughput
    command: ["avtools", "--logs", "run-landb"]
    activeDeadlineSeconds: 180
    backoffLimit: 1
    netRaw: false
    secretKeys: ["DATABASE_URL", "MONIT_PASSWORD", "LANDB_CLIENT_SECRET"]

# ---------------------------------------------------------------------------
# Recovery watchdog (AP layer 4): alert when a CronJob hasn't succeeded within
# freshnessMinutes. Requires the Prometheus Operator CRD (kube-prometheus-stack).
# ---------------------------------------------------------------------------
prometheusRule:
  enabled: false
  freshnessMinutes: 10

# ---------------------------------------------------------------------------
# Fluent Bit log shipper → CERN MonIT OpenSearch (otel-logs_avtools).
# Default OFF: the MonIT logs tenant/index is not provisioned yet
# (see AVTOOLS-OPENSEARCH.md). Flip on once SNOW confirms the endpoint/mapping.
# ---------------------------------------------------------------------------
fluentBit:
  enabled: false
  image: cr.fluentbit.io/fluent/fluent-bit:3.1.9
  # OTLP/HTTP logs receiver (different port+protocol from the metrics :4316 gRPC).
  logsEndpointHost: monit-otlp.cern.ch
  logsEndpointPort: "4319"
  logsUri: /v1/logs
  tenant: avtools
  # Password comes from the Secret (key AVTOOLS_LOGS_PWD), never templated here.
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

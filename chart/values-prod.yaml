# PROD overlay — namespace avtools-prod. PROD accounts + PROD PyPI image tag.
environment: prod

image:
  tag: prod

eam:
  username: avtools
landb:
  clientId: av-tools

# 15-min cadence: matches the Grafana 15-min interval/gather and gives the
# 12-thread (3x4) snmp sweep room to finish inside the window.
jobs:
  snmp-timeseries:
    schedule: "*/15 * * * *"
  run-eam:
    schedule: "*/15 * * * *"
  run-landb:
    schedule: "*/15 * * * *"

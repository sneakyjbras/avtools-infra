# PROD overlay — namespace avtools-prod. PROD accounts + PROD PyPI image tag.
environment: prod

image:
  tag: prod

eam:
  username: avtools
landb:
  clientId: av-tools

# 5-min cadence: matches the Grafana 5-min tick bucketing and gives the
# lower-thread pods room to finish inside the window.
jobs:
  snmp-timeseries:
    schedule: "*/5 * * * *"
  run-eam:
    schedule: "*/5 * * * *"
  run-landb:
    schedule: "*/5 * * * *"

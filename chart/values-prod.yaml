# PROD overlay — namespace avtools-prod. PROD accounts + PROD PyPI image tag.
environment: prod

image:
  tag: prod

eam:
  username: avtools
landb:
  clientId: av-tools

# Kubernetes Events -> MonIT OpenSearch (see chart/values.yaml `fluentBit`).
# QA and PROD are enabled independently; flip this to true when ready.
fluentBit:
  enabled: false

# Schedules just mirror the base chart's tiered stagger (see chart/values.yaml
# `jobs:` comment for the full offset rationale).
jobs:
  snmp-critical:
    schedule: "*/5 * * * *"
  snmp-high:
    schedule: "3-59/15 * * * *"
  snmp-medium:
    schedule: "7 * * * *"
  snmp-low:
    schedule: "11 */6 * * *"
  run-eam:
    schedule: "*/5 * * * *"
  run-landb:
    schedule: "*/5 * * * *"

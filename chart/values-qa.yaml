# QA overlay — namespace avtools-qa. QA accounts + QA PyPI image tag.
environment: qa

image:
  tag: qa

eam:
  username: avqa
landb:
  clientId: av-tools-qa

# 5-min cadence: matches the Grafana 5-min tick bucketing and gives the
# lower-thread pods room to finish inside the window.
jobs:
  snmp-timeseries:
    schedule: "*/15 * * * *"
  run-eam:
    schedule: "*/5 * * * *"
  run-landb:
    schedule: "*/5 * * * *"

# QA overlay — namespace avtools-qa. QA accounts + QA PyPI image tag.
environment: qa

image:
  tag: qa

eam:
  username: avqa
landb:
  clientId: av-tools-qa

# Kubernetes Events -> MonIT OpenSearch (see chart/values.yaml `fluentBit`).
# QA and PROD are enabled independently; flip this to true when ready.
fluentBit:
  enabled: false

# Schedules just mirror the base chart's tiered stagger (see chart/values.yaml
# `jobs:` comment for the full offset rationale) — QA runs the same cadence as
# PROD on purpose so tier behavior/publish-filter is validated at real cadence
# before promotion, not just relative timing.
jobs:
  snmp-critical:
    schedule: "*/5 * * * *" # */2 pushed ~180k samples/hr (8 streams) and MONIT dropped the excess in ~1h blocks; */5 matches the Puppet VM's clean ~72k/hr rate. 15-min Grafana gather still gets ~3 samples/window, so plots stay smooth.
  snmp-high:
    schedule: "3-59/15 * * * *"
  snmp-medium:
    schedule: "7 * * * *"
  snmp-low:
    schedule: "11 */6 * * *"
  run-eam:
    schedule: "*/5 * * * *"
  run-landb:
    schedule: "*/5 * * * *"

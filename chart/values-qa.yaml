# QA overlay — namespace avtools-qa. QA accounts + QA PyPI image tag.
environment: qa

image:
  tag: qa

eam:
  username: avqa
landb:
  clientId: av-tools-qa

# 5-min cadence: matches the Grafana 5-min interval/gather; the 48-thread (6x8)
# snmp sweep finishes inside the window.
jobs:
  snmp-timeseries:
    schedule: "*/5 * * * *" # */2 pushed ~180k samples/hr (8 streams) and MONIT dropped the excess in ~1h blocks; */5 matches the Puppet VM's clean ~72k/hr rate. 15-min Grafana gather still gets ~3 samples/window, so plots stay smooth.
  run-eam:
    schedule: "*/5 * * * *"
  run-landb:
    schedule: "*/5 * * * *"

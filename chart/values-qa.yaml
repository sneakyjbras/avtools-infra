# QA overlay — namespace avtools-qa. QA accounts + QA PyPI image tag.
environment: qa

image:
  tag: qa

eam:
  username: avqa
landb:
  clientId: av-tools-qa

# 15-min cadence: matches the Grafana 15-min interval/gather and gives the
# 12-thread (3x4) snmp sweep room to finish inside the window.
jobs:
  snmp-timeseries:
    schedule: "*/15 * * * *"
  run-eam:
    schedule: "*/15 * * * *"
  run-landb:
    schedule: "*/15 * * * *"

# QA overlay — namespace avtools-qa. QA accounts + QA PyPI image tag.
environment: qa

image:
  tag: qa

eam:
  username: avqa
landb:
  clientId: av-tools-qa

# 5-min cadence: matches the Grafana 5-min interval/gather; the 48-thread (6x8)
# snmp sweep finishes inside the window.
jobs:
  snmp-timeseries:
    schedule: "*/2 * * * *" # dense sampling under the 15-min Grafana gather (base is */2; this overlay is the operative value for qa)
  run-eam:
    schedule: "*/5 * * * *"
  run-landb:
    schedule: "*/5 * * * *"

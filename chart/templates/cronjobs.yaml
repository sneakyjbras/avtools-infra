{{- range $name, $job := .Values.jobs }}
{{- if $job.enabled }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "avtools.fullname" $ }}-{{ $name }}
  labels: {{- include "avtools.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $name }}
spec:
  schedule: {{ $job.schedule | quote }}
  # AP model: never overlap; a missed tick converges on the next cycle.
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 30
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      completions: {{ $job.shards }}
      parallelism: {{ $job.shards }}
      completionMode: Indexed
      backoffLimit: {{ $job.backoffLimit | default 1 }}
      activeDeadlineSeconds: {{ $job.activeDeadlineSeconds | default 100 }}
      template:
        metadata:
          labels: {{- include "avtools.selectorLabels" $ | nindent 12 }}
            app.kubernetes.io/component: {{ $name }}
        spec:
          restartPolicy: Never
          serviceAccountName: {{ include "avtools.serviceAccountName" $ }}
          automountServiceAccountToken: false
          {{- if $.Values.topologySpread.enabled }}
          # Spread same-component pods one-per-node so snmp-timeseries' shards
          # land one per worker node instead of stacking on a single 2-core box.
          # Soft (ScheduleAnyway) so a down/cordoned node never blocks the tick.
          topologySpreadConstraints:
            - maxSkew: {{ $.Values.topologySpread.maxSkew | default 1 }}
              topologyKey: kubernetes.io/hostname
              whenUnsatisfiable: {{ $.Values.topologySpread.whenUnsatisfiable | default "ScheduleAnyway" }}
              labelSelector:
                matchLabels: {{- include "avtools.selectorLabels" $ | nindent 18 }}
                  app.kubernetes.io/component: {{ $name }}
          {{- end }}
          {{- with $.Values.imagePullSecrets }}
          imagePullSecrets:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          securityContext:
            runAsNonRoot: true
            runAsUser: 1001
            fsGroup: 1001
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: {{ $name }}
              image: "{{ $.Values.image.repository }}:{{ $.Values.image.tag }}"
              imagePullPolicy: {{ $.Values.image.pullPolicy }}
              command: {{ toJson $job.command }}
              envFrom:
                - configMapRef:
                    name: {{ include "avtools.fullname" $ }}-config
              env:
                # completions must equal SHARD_TOTAL; JOB_COMPLETION_INDEX is
                # auto-injected by the Indexed Job and read as --shard-index.
                - name: SHARD_TOTAL
                  value: {{ $job.shards | quote }}
                - name: THREADS
                  value: {{ $job.threads | quote }}
                {{- if $job.stableInstanceId }}
                # Stable OTLP service.instance.id for single-pod jobs (run-eam /
                # run-landb). Without it, gethostname() is the ephemeral pod name,
                # which mints a new Mimir `instance` series every cycle. snmp does
                # not need this — it derives a stable per-shard id from
                # JOB_COMPLETION_INDEX (see av-tools _stable_instance_id).
                - name: AVTOOLS_INSTANCE_ID
                  value: {{ printf "avtools-%s-%s" $.Values.environment $name | quote }}
                {{- end }}
                {{- range $job.secretKeys }}
                - name: {{ . }}
                  valueFrom:
                    secretKeyRef:
                      name: {{ $.Values.secretName }}
                      key: {{ . }}
                {{- end }}
                {{- if $.Values.sentry.enabled }}
                - name: SENTRY_DSN
                  valueFrom:
                    secretKeyRef:
                      name: {{ $.Values.secretName }}
                      key: SENTRY_DSN
                {{- end }}
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
                  {{- if $job.netRaw }}
                  add: ["NET_RAW"]
                  {{- end }}
              volumeMounts:
                - name: logdir
                  mountPath: /tmp/avtools
                # cern_oauthlib writes its OAuth token cache under ~/.cache; the
                # root FS is read-only, so give it a writable emptyDir. Without
                # this, LanDB auth fails and the SNMP fleet comes back empty.
                - name: cachedir
                  mountPath: /home/avtools/.cache
              resources: {{- toYaml $.Values.resources | nindent 16 }}
          volumes:
            - name: logdir
              emptyDir: {}
            - name: cachedir
              emptyDir: {}
{{- end }}
{{- end }}

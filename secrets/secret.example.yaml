# TEMPLATE ONLY — do not fill in and commit. The real Secret is created by
# scripts/sync-secret.sh (tbag -> Secret). A filled secret.yaml
# is gitignored. Use this only as a manual fallback when the deploy host has no
# tbag access.
#
#   qa keys:   database_url_qa, eam_qa_pwd, landb_qa_pwd, monit_pwd, avtools_logs_pwd
#   prod keys: database_url,    eam_pwd,    landb_pwd,    monit_pwd, avtools_logs_pwd
apiVersion: v1
kind: Secret
metadata:
  name: avtools-secrets
  namespace: avtools-qa
type: Opaque
stringData:
  DATABASE_URL: "" # tbag show database_url_qa --hg itdcim/avtools --plain
  MONIT_PASSWORD: "" # tbag show monit_pwd        --hg itdcim/avtools --plain
  MY_PASSWORD: "" # tbag show eam_qa_pwd       --hg itdcim/avtools --plain  (EAM)
  LANDB_CLIENT_SECRET: "" # tbag show landb_qa_pwd     --hg itdcim/avtools --plain
  AVTOOLS_LOGS_PWD: "" # tbag show avtools_logs_pwd --hg itdcim/avtools --plain (optional)
  SENTRY_DSN: "" # from IT-PW when the Sentry project is created (optional)

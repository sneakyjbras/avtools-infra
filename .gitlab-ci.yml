# CI for the GitOps/infra repo: VALIDATE ONLY (Terraform syntax + Helm chart).
#
# Terraform plan/apply are NOT run in CI, on purpose:
#   - `apply` needs a Keystone trust, which Magnum can only create for a Kerberos
#     user; CI's application credentials cannot (see docs/cluster-buildout-runbook.md).
#   - `plan` needs OpenStack read auth for the cluster_template data source, which
#     CI has no credentials for either ("One of 'auth_url' or 'cloud' must be...").
# So cluster plan/apply are local, human-with-Kerberos operations:
#     kinit <you>@CERN.CH && source scripts/os-auth.sh && cd terraform && terraform apply
# CI's job is to catch broken Terraform/Helm before it reaches a human — which it
# does auth-free. (To add MR `plan` diffs later, set OS_* app-credential CI vars
# and restore a plan job; it only enables plan, not apply.)
#
# GitLab SAST + Secret Detection (enabled via the project UI) are preserved below.
include:
  - template: Security/SAST.gitlab-ci.yml
  - template: Security/Secret-Detection.gitlab-ci.yml

stages:
  - validate
  - test # SAST
  - secret-detection

variables:
  TF_ROOT: ${CI_PROJECT_DIR}/terraform
  TF_STATE_NAME: avtools
  SECRET_DETECTION_ENABLED: "true"

# Pin the GitLab security scanners to their stages (from the project's template).
sast:
  stage: test

secret_detection:
  stage: secret-detection

# ---------------------------------------------------------------------------
# Terraform (GitLab-managed state via the gitlab-terraform wrapper)
# ---------------------------------------------------------------------------
.tf:
  image:
    name: registry.gitlab.com/gitlab-org/terraform-images/stable:latest
    entrypoint: [""]
  cache:
    key: "tf-${TF_STATE_NAME}"
    paths:
      - ${TF_ROOT}/.terraform

# Syntax + config validation only. -backend=false needs no state/credentials.
tf_fmt_validate:
  extends: .tf
  stage: validate
  script:
    - cd "$TF_ROOT"
    - terraform fmt -check -recursive
    - terraform init -backend=false
    - terraform validate

# ---------------------------------------------------------------------------
# Helm chart: lint + render + schema-validate every manifest (both envs)
# ---------------------------------------------------------------------------
helm_validate:
  stage: validate
  image:
    name: alpine/helm:3.16.2
    entrypoint: [""]
  before_script:
    - apk add --no-cache curl tar
    - curl -fsSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar xz -C /usr/local/bin kubeconform
  script:
    - helm lint chart -f chart/values.yaml -f chart/values-qa.yaml
    - >
      helm template avtools chart -n avtools-qa
      -f chart/values.yaml -f chart/values-qa.yaml
      | kubeconform -strict -ignore-missing-schemas -summary
    - >
      helm template avtools chart -n avtools-prod
      -f chart/values.yaml -f chart/values-prod.yaml
      --set fluentBit.enabled=true --set prometheusRule.enabled=true
      | kubeconform -strict -ignore-missing-schemas -summary
